<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscripción · FixtureGo</title>
  <meta name="description" content="Inscribite a un evento abierto en FixtureGo Padel." />
  <style>
    :root {
      --bg: #0b1f2e;
      --card: #123049;
      --text: #f4f7fb;
      --muted: #9fb3c8;
      --accent: #7ed957;
      --chip: #1e4d7a;
      --danger: #ffb4a8;
      --line: #2a5070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1100px 520px at 15% -15%, #1a4a6e, var(--bg));
      color: var(--text);
      padding: 20px 16px 48px;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    [hidden] { display: none !important; }

    .nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; gap: 12px;
    }
    .nav a, .linkish {
      color: var(--accent); font-weight: 700; text-decoration: none; font-size: .9rem;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .linkish.muted { color: var(--muted); font-weight: 500; text-decoration: underline; }
    .userbox { text-align: right; max-width: 58%; }
    .userbox .row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #2a6b45, var(--accent));
      color: #0b1f2e; font-weight: 800; font-size: .85rem;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .hello { color: var(--accent); font-size: .9rem; font-weight: 700; }
    .user-email { color: var(--muted); font-size: .75rem; margin-top: 2px; }
    .user-actions { margin-top: 4px; display: flex; justify-content: flex-end; gap: 10px; }

    .card {
      background: var(--card); border-radius: 18px; overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.3);
    }
    .card-head {
      background: #0e2a40; padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .chip {
      background: var(--chip); color: #fff; font-size: .7rem; font-weight: 700;
      letter-spacing: .04em; padding: 3px 9px; border-radius: 999px;
    }
    .body { padding: 16px 18px 20px; }
    .title { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }
    .meta { color: var(--muted); font-size: .92rem; margin: 3px 0; }

    .roster { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .roster h3 { margin: 0 0 6px; font-size: .9rem; }
    .roster ol { margin: 0; padding-left: 1.2rem; color: var(--muted); font-size: .92rem; }
    .roster li { margin: 2px 0; }

    .action {
      margin-top: 16px; padding: 16px; border-radius: 14px;
      background: #0e2a40; border: 1px solid var(--line); text-align: center;
    }
    .action .status {
      margin: 0 0 6px; font-weight: 700; color: var(--accent); font-size: 1.05rem;
    }
    .action .sub { margin: 0 0 12px; color: var(--muted); font-size: .9rem; line-height: 1.4; }

    .btn {
      display: block; width: 100%; margin: 0; text-align: center; border: none;
      background: var(--accent); color: #0b1f2e; font-weight: 700;
      padding: 14px 18px; border-radius: 999px; cursor: pointer; font-size: 1rem;
      text-decoration: none;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-google { background: #fff; color: #1f1f1f; }
    .btn-ghost {
      background: transparent; color: var(--danger); border: 1px solid var(--danger);
      margin-top: 10px;
    }
    .footer {
      margin-top: 16px; text-align: center;
    }
    .footer a { color: var(--muted); font-size: .85rem; }

    .err-page { color: var(--danger); text-align: center; margin-top: 40px; }
    .msg { margin-top: 10px; font-size: .9rem; }
    .msg.ok { color: var(--accent); }
    .msg.err { color: var(--danger); }
    .loading { text-align: center; color: var(--muted); padding: 40px 12px; }
  </style>
  <script src="./firebase-config.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="../eventos/">← Eventos</a>
      <div id="navUser" class="userbox" hidden>
        <div class="row">
          <div class="avatar" id="avatar">G</div>
          <div class="hello" id="helloLine"></div>
        </div>
        <div class="user-email" id="emailLine"></div>
        <div class="user-actions">
          <button type="button" class="linkish muted" id="switchBtn">Cambiar cuenta</button>
          <button type="button" class="linkish muted" id="signOutBtn">Salir</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading">Cargando evento…</div>
    <p class="err-page" id="err" hidden>No encontramos este evento.</p>

    <div class="card" id="card" hidden>
      <div class="card-head">
        <span class="chip" id="typeChip">EVENTO</span>
        <strong>FixtureGo</strong>
      </div>
      <div class="body">
        <p class="meta" id="when">—</p>
        <h1 class="title" id="title">Evento</h1>
        <p class="meta" id="modality"></p>
        <p class="meta" id="zone"></p>
        <p class="meta" id="venue"></p>
        <p class="meta" id="spots"></p>
        <p class="meta" id="min"></p>

        <div class="roster" id="rosterBox" hidden>
          <h3>Inscritos</h3>
          <ol id="rosterList"></ol>
          <p class="meta" id="rosterWait" hidden></p>
        </div>

        <!-- Una sola zona de acción según estado -->
        <div class="action" id="action">
          <p class="status" id="actionTitle">…</p>
          <p class="sub" id="actionSub"></p>
          <button type="button" class="btn" id="primaryBtn" hidden></button>
          <button type="button" class="btn btn-ghost" id="leaveBtn" hidden>Borrarme del evento</button>
          <p class="msg" id="msg" hidden></p>
        </div>

        <div class="footer">
          <a id="openApp" href="#">Abrir en la app</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth, signOut, onAuthStateChanged,
      GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
      signInWithCredential, setPersistence, browserLocalPersistence,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, setDoc, updateDoc, deleteDoc,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    let eventId = params.get("id");
    if (!eventId) {
      const parts = location.pathname.split("/").filter(Boolean);
      const i = parts.indexOf("e");
      if (i >= 0 && parts[i + 1] && parts[i + 1] !== "index.html") eventId = parts[i + 1];
    }

    const cfg = window.FIXTUREGO_FIREBASE;
    const ready = cfg && cfg.apiKey && cfg.apiKey !== "YOUR_API_KEY" && cfg.projectId;

    const deepHttps = eventId
      ? "https://fixturego.com/e/?id=" + encodeURIComponent(eventId)
      : "https://fixturego.com/";
    const playStore =
      "https://play.google.com/store/apps/details?id=com.gopadel.americano";

    const openApp = document.getElementById("openApp");
    openApp.href = deepHttps;
    openApp.addEventListener("click", (e) => {
      e.preventDefault();
      const ua = navigator.userAgent || "";
      if (/Android/i.test(ua) && eventId) {
        window.location.href =
          "intent://fixturego.com/e/?id=" + encodeURIComponent(eventId) +
          "#Intent;scheme=https;package=com.gopadel.americano;" +
          "S.browser_fallback_url=" + encodeURIComponent(playStore) + ";end";
        return;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.href = deepHttps;
        setTimeout(() => { window.location.href = playStore; }, 1500);
        return;
      }
      window.open(deepHttps, "_blank");
    });

    if (!eventId) {
      document.getElementById("loading").hidden = true;
      document.getElementById("err").hidden = false;
      throw new Error("missing id");
    }

    let auth = null;
    let db = null;
    let eventState = null;
    let myStatus = null; // null | confirmed | waitlist
    let busy = false;
    const provider = new GoogleAuthProvider();

    const actionTitle = document.getElementById("actionTitle");
    const actionSub = document.getElementById("actionSub");
    const primaryBtn = document.getElementById("primaryBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const msgEl = document.getElementById("msg");

    function isGoogle(u) {
      return !!(u && !u.isAnonymous && u.providerData &&
        u.providerData.some((p) => p.providerId === "google.com"));
    }
    function niceName(u) {
      const dn = ((u && u.displayName) || "").trim();
      if (dn) return dn;
      const local = ((u && u.email) || "").split("@")[0];
      return local || "Jugador";
    }
    function greetName(u) {
      const dn = ((u && u.displayName) || "").trim();
      if (dn) return dn.split(/\s+/)[0];
      const local = ((u && u.email) || "").split("@")[0];
      return local || "jugador";
    }
    function initial(u) {
      return greetName(u).charAt(0).toUpperCase() || "F";
    }
    function mobile() {
      return /Android|iPhone|iPad|iPod|Mobile|Instagram|FBAN|FBAV|WhatsApp/i.test(
        navigator.userAgent || "",
      );
    }
    function showMsg(text, isErr) {
      msgEl.hidden = !text;
      msgEl.textContent = text || "";
      msgEl.className = "msg " + (isErr ? "err" : "ok");
    }

    function fillEvent(s) {
      document.getElementById("typeChip").textContent =
        s.type === "torneo" ? "TORNEO" : "AMERICANA";
      document.getElementById("title").textContent = s.title || "Evento";
      document.getElementById("when").textContent = s.startsAt
        ? new Date(s.startsAt).toLocaleString("es", {
            weekday: "long", day: "numeric", month: "long",
            hour: "2-digit", minute: "2-digit",
          })
        : "—";
      const map = {
        all_vs_all: "Todos vs todos",
        pairs: "Por parejas",
        mixed_fixed: "Mixta fija",
        mixed_rotating: "Mixta rotativa",
        custom: "Personalizada",
        ladder: "Escalera",
      };
      const mod = document.getElementById("modality");
      if (s.type === "americana" && s.modality) {
        mod.hidden = false;
        mod.textContent = map[s.modality] || s.modality;
      } else mod.hidden = true;
      const zone = document.getElementById("zone");
      if (s.zone) { zone.hidden = false; zone.textContent = "Zona: " + s.zone; }
      else zone.hidden = true;
      const venue = document.getElementById("venue");
      if (s.venue) { venue.hidden = false; venue.textContent = s.venue; }
      else venue.hidden = true;
      let spots = s.joined + " de " + s.capacity + " plazas";
      if (s.waitlist > 0) spots += " · " + s.waitlist + " reserva";
      document.getElementById("spots").textContent = spots;
      document.getElementById("min").textContent =
        s.minConfirmed > 0 ? "Mínimo para iniciar: " + s.minConfirmed : "";
    }

    function renderRoster(signups) {
      const confirmed = signups
        .filter((s) => s.status !== "waitlist")
        .sort((a, b) => (a.joinedAtEpochMs || 0) - (b.joinedAtEpochMs || 0));
      const wait = signups.filter((s) => s.status === "waitlist").length;
      const box = document.getElementById("rosterBox");
      const ol = document.getElementById("rosterList");
      const waitEl = document.getElementById("rosterWait");
      ol.innerHTML = "";
      if (!confirmed.length && !wait) {
        box.hidden = true;
        return;
      }
      box.hidden = false;
      confirmed.forEach((s) => {
        const li = document.createElement("li");
        li.textContent = s.displayName || "Jugador";
        ol.appendChild(li);
      });
      if (wait > 0) {
        waitEl.hidden = false;
        waitEl.textContent = "+" + wait + " en reserva";
      } else waitEl.hidden = true;
    }

    function renderAction() {
      const u = auth && auth.currentUser;
      const google = isGoogle(u);
      const open = eventState && eventState.status === "open";
      showMsg("", false);
      leaveBtn.hidden = true;
      primaryBtn.hidden = true;
      primaryBtn.onclick = null;
      primaryBtn.className = "btn";

      const nav = document.getElementById("navUser");
      if (google) {
        nav.hidden = false;
        document.getElementById("helloLine").textContent =
          "¡Hola, " + greetName(u) + "!";
        document.getElementById("emailLine").textContent = u.email || "";
        document.getElementById("avatar").textContent = initial(u);
      } else {
        nav.hidden = true;
      }

      if (!open) {
        actionTitle.textContent = "Inscripción cerrada";
        actionSub.textContent = "Este evento ya no acepta más jugadores desde la web.";
        return;
      }

      if (!google) {
        actionTitle.textContent = "Entrá para inscribirte";
        actionSub.textContent = "Con Google quedás logueado y te apuntás en un clic.";
        primaryBtn.hidden = false;
        primaryBtn.className = "btn btn-google";
        primaryBtn.textContent = "Continuar con Google";
        primaryBtn.onclick = () => loginGoogle();
        return;
      }

      if (myStatus) {
        actionTitle.textContent =
          myStatus === "waitlist" ? "Estás en lista de espera" : "Ya estás inscrito";
        actionSub.textContent =
          myStatus === "waitlist"
            ? "Si se libera una plaza, el organizador puede subirte."
            : "Te esperamos. Podés volver a Eventos o salir de la lista.";
        leaveBtn.hidden = false;
        return;
      }

      actionTitle.textContent = "¿Te sumás?";
      actionSub.textContent = "Te inscribís como " + niceName(u) + ".";
      primaryBtn.hidden = false;
      primaryBtn.className = "btn";
      primaryBtn.textContent = "Inscribirme";
      primaryBtn.onclick = () => joinEvent();
    }

    async function finishRedirect() {
      try {
        await getRedirectResult(auth);
      } catch (e) {
        const code = e && e.code;
        if (code === "auth/credential-already-in-use" ||
            code === "auth/email-already-in-use" ||
            code === "auth/account-exists-with-different-credential") {
          const cred = GoogleAuthProvider.credentialFromError(e);
          if (cred) await signInWithCredential(auth, cred);
        } else console.warn(e);
      }
    }

    async function loginGoogle(pickAccount) {
      if (busy) return;
      busy = true;
      primaryBtn.disabled = true;
      actionSub.textContent = "Abriendo Google…";
      if (pickAccount) {
        provider.setCustomParameters({ prompt: "select_account" });
      } else {
        provider.setCustomParameters({});
      }
      try {
        if (mobile()) {
          await signInWithRedirect(auth, provider);
          return;
        }
        try {
          await signInWithPopup(auth, provider);
        } catch (e) {
          if (e && (e.code === "auth/popup-blocked" ||
              e.code === "auth/operation-not-supported-in-this-environment" ||
              e.code === "auth/cancelled-popup-request")) {
            await signInWithRedirect(auth, provider);
            return;
          }
          throw e;
        }
      } catch (e) {
        if (e && e.code === "auth/popup-closed-by-user") {
          showMsg("Cerraste la ventana. Probá de nuevo.", true);
        } else {
          showMsg(e.message || "No se pudo iniciar sesión.", true);
        }
        renderAction();
      } finally {
        busy = false;
        primaryBtn.disabled = false;
      }
    }

    async function loadEvent(id) {
      const snap = await getDoc(doc(db, "open_events", id));
      if (!snap.exists()) return null;
      const d = snap.data();
      return {
        id,
        type: d.type || "americana",
        modality: d.americanaModality || "",
        title: d.title || "Evento",
        startsAt: d.startsAtEpochMs || 0,
        capacity: d.capacity || 0,
        minConfirmed: d.minConfirmed || 0,
        joined: d.joinedCount || 0,
        waitlist: d.waitlistCount || 0,
        zone: d.zone || "",
        venue: d.venueText || "",
        status: d.status || "open",
      };
    }

    async function loadSignups() {
      const snap = await getDocs(collection(db, "open_events", eventId, "signups"));
      const list = [];
      snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
      return list;
    }

    async function refreshMineAndRoster() {
      const signups = await loadSignups();
      renderRoster(signups);
      const u = auth && auth.currentUser;
      myStatus = null;
      if (isGoogle(u)) {
        const email = (u.email || "").toLowerCase();
        const mine = signups.find((s) =>
          s.uid === u.uid ||
          (email && s.email && s.email.toLowerCase() === email)
        );
        if (mine) {
          myStatus = mine.status === "waitlist" ? "waitlist" : "confirmed";
          window.__mineUid = mine.uid;
        }
      }
      renderAction();
    }

    async function joinEvent() {
      const u = auth && auth.currentUser;
      if (!isGoogle(u) || busy) return;
      busy = true;
      primaryBtn.disabled = true;
      try {
        const fresh = await loadEvent(eventId);
        if (!fresh || fresh.status !== "open") throw new Error("Inscripción cerrada");
        const signups = await loadSignups();
        const email = (u.email || "").toLowerCase();
        const name = niceName(u).slice(0, 79);
        const already = signups.find((s) =>
          s.uid === u.uid ||
          (email && s.email && s.email.toLowerCase() === email)
        );
        if (already) {
          myStatus = already.status === "waitlist" ? "waitlist" : "confirmed";
          window.__mineUid = already.uid;
          eventState = fresh;
          fillEvent(eventState);
          renderRoster(signups);
          renderAction();
          return;
        }
        const status = fresh.joined < fresh.capacity ? "confirmed" : "waitlist";
        await setDoc(doc(db, "open_events", eventId, "signups", u.uid), {
          uid: u.uid,
          displayName: name.slice(0, 79),
          email,
          status,
          joinedAtEpochMs: Date.now(),
        });
        const joinedCount = fresh.joined + (status === "confirmed" ? 1 : 0);
        const waitlistCount = fresh.waitlist + (status === "waitlist" ? 1 : 0);
        await updateDoc(doc(db, "open_events", eventId), { joinedCount, waitlistCount });
        eventState = { ...fresh, joined: joinedCount, waitlist: waitlistCount };
        fillEvent(eventState);
        myStatus = status;
        window.__mineUid = u.uid;
        await refreshMineAndRoster();
        showMsg(status === "waitlist" ? "Quedaste en reserva." : "¡Listo, estás inscrito!", false);
      } catch (e) {
        console.error(e);
        showMsg(e.message || "No se pudo inscribir.", true);
      } finally {
        busy = false;
        primaryBtn.disabled = false;
      }
    }

    async function leaveEvent() {
      const u = auth && auth.currentUser;
      if (!u || busy) return;
      if (!confirm("¿Borrarte de este evento?")) return;
      busy = true;
      leaveBtn.disabled = true;
      try {
        const signupUid = window.__mineUid || u.uid;
        if (signupUid !== u.uid) {
          throw new Error(
            "Esta plaza se anotó con otra sesión. Pedile al organizador que te saque."
          );
        }
        await deleteDoc(doc(db, "open_events", eventId, "signups", signupUid));
        const remaining = await loadSignups();
        const joinedCount = remaining.filter((s) => s.status !== "waitlist").length;
        const waitlistCount = remaining.filter((s) => s.status === "waitlist").length;
        await updateDoc(doc(db, "open_events", eventId), { joinedCount, waitlistCount });
        myStatus = null;
        window.__mineUid = null;
        const fresh = await loadEvent(eventId);
        if (fresh) {
          eventState = fresh;
          fillEvent(eventState);
        }
        renderRoster(remaining);
        renderAction();
        showMsg("Te borraste del evento.", false);
      } catch (e) {
        console.error(e);
        showMsg(e.message || "No se pudo borrar.", true);
      } finally {
        busy = false;
        leaveBtn.disabled = false;
      }
    }

    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await signOut(auth);
      myStatus = null;
      renderAction();
    });
    document.getElementById("switchBtn").addEventListener("click", async () => {
      await signOut(auth);
      myStatus = null;
      renderAction();
      await loginGoogle(true);
    });
    leaveBtn.addEventListener("click", leaveEvent);

    if (!ready) {
      document.getElementById("loading").textContent = "Falta configurar Firebase.";
    } else {
      const app = initializeApp(cfg);
      auth = getAuth(app);
      db = getFirestore(app);
      try { await setPersistence(auth, browserLocalPersistence); } catch (_) {}
      await finishRedirect();

      try {
        eventState = await loadEvent(eventId);
        document.getElementById("loading").hidden = true;
        if (!eventState) {
          document.getElementById("err").hidden = false;
        } else {
          document.getElementById("card").hidden = false;
          fillEvent(eventState);
          await refreshMineAndRoster();
        }
      } catch (e) {
        console.error(e);
        document.getElementById("loading").hidden = true;
        document.getElementById("err").hidden = false;
        document.getElementById("err").textContent = e.message || "Error al cargar.";
      }

      onAuthStateChanged(auth, async () => {
        if (eventState) await refreshMineAndRoster();
        else renderAction();
      });
    }
  </script>
</body>
</html>
