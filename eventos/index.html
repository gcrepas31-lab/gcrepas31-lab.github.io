<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FixtureGo · Eventos</title>
  <meta name="description" content="Inscripciones abiertas FixtureGo Padel." />
  <style>
    :root {
      --bg: #0b1f2e;
      --card: #123049;
      --text: #f4f7fb;
      --muted: #9fb3c8;
      --accent: #7ed957;
      --chip: #1e4d7a;
      --danger: #ffb4a8;
      --line: #2a5070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1100px 520px at 15% -15%, #1a4a6e, var(--bg));
      color: var(--text);
      padding: 24px 16px 40px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    [hidden] { display: none !important; }

    .gate {
      min-height: 72vh; display: flex; flex-direction: column;
      justify-content: center; text-align: center; padding: 12px 4px;
    }
    .gate .brand {
      width: 80px; height: 80px; border-radius: 18px; object-fit: cover;
      margin: 0 auto 18px; background: var(--card);
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    .gate h1 { font-size: 1.8rem; margin: 0 0 10px; letter-spacing: -.02em; }
    .gate p { color: var(--muted); margin: 0 0 26px; line-height: 1.45; font-size: 1rem; }
    .gate .hint { margin-top: 16px; font-size: .85rem; color: var(--muted); }

    .profile {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 12px 14px; margin-bottom: 16px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #2a6b45, var(--accent));
      color: #0b1f2e; font-weight: 800; font-size: 1.1rem;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .profile .who { flex: 1; min-width: 0; }
    .profile .hello {
      margin: 0; color: var(--accent); font-weight: 700; font-size: 1.05rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile .email {
      margin: 2px 0 0; color: var(--muted); font-size: .8rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .linkish {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: .8rem; text-decoration: underline; padding: 2px 0; white-space: nowrap;
    }
    .linkish:hover { color: var(--text); }

    .page-title { font-size: 1.25rem; margin: 0 0 12px; font-weight: 700; }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 14px;
      background: rgba(0,0,0,.18); border-radius: 999px; padding: 4px;
    }
    .tab {
      flex: 1; padding: 10px; border: none; border-radius: 999px;
      background: transparent; color: var(--muted); font-weight: 700;
      cursor: pointer; font-size: .9rem;
    }
    .tab.active { background: var(--accent); color: #0b1f2e; }

    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border-radius: 16px; padding: 16px 18px;
      margin-bottom: 10px; border: 1px solid rgba(255,255,255,.04);
      transition: border-color .15s ease;
    }
    .card:hover, .card:active { border-color: var(--accent); }
    .chip {
      display: inline-block; background: var(--chip); color: #fff;
      font-size: .68rem; font-weight: 700; letter-spacing: .04em;
      padding: 3px 8px; border-radius: 999px; margin-bottom: 8px;
    }
    .badge {
      float: right; font-size: .72rem; color: var(--accent); font-weight: 700;
      margin-top: 2px;
    }
    .card h2 { font-size: 1.12rem; margin: 0 0 4px; }
    .meta { color: var(--muted); font-size: .9rem; margin: 2px 0; }
    .chev { float: right; color: var(--muted); font-size: 1.1rem; margin-top: -2px; }

    .btn {
      display: block; width: 100%; text-align: center; border: none;
      background: var(--accent); color: #0b1f2e; font-weight: 700;
      padding: 14px 18px; border-radius: 999px; cursor: pointer; font-size: 1rem;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-google { background: #fff; color: #1f1f1f; }

    .empty, .loading, .err {
      text-align: center; color: var(--muted); padding: 36px 12px; font-size: .95rem;
      line-height: 1.45;
    }
    .err { color: var(--danger); }
    .err a { color: var(--accent); }
  </style>
  <script src="../e/firebase-config.js"></script>
</head>
<body>
  <div class="wrap">
    <section id="gate" class="gate" hidden>
      <img class="brand" src="../logo-fixturego.jpg" alt="FixtureGo"
           onerror="this.style.display='none'" />
      <h1>FixtureGo</h1>
      <p>Entrá con Google para ver eventos abiertos e inscribirte en un clic.</p>
      <button type="button" class="btn btn-google" id="googleBtn">Continuar con Google</button>
      <p class="hint" id="gateHint">Por ahora el acceso es solo con Google. Quedás logueado en este navegador.</p>
      <p class="err" id="gateErr" hidden></p>
    </section>

    <section id="app" hidden>
      <div class="profile">
        <div class="avatar" id="avatar">G</div>
        <div class="who">
          <p class="hello" id="hello">¡Hola!</p>
          <p class="email" id="emailLine"></p>
        </div>
        <div class="actions">
          <button type="button" class="linkish" id="switchBtn">Cambiar cuenta</button>
          <button type="button" class="linkish" id="signOutBtn">Salir</button>
        </div>
      </div>

      <h2 class="page-title">Eventos</h2>

      <div class="tabs">
        <button type="button" class="tab active" id="tabOpen">Abiertos</button>
        <button type="button" class="tab" id="tabMine">Mis inscripciones</button>
      </div>

      <div id="list" class="loading">Cargando…</div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth, signOut, onAuthStateChanged,
      GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
      signInWithCredential, setPersistence, browserLocalPersistence,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore, collection, query, where, orderBy, getDocs, getDoc,
      collectionGroup,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const cfg = window.FIXTUREGO_FIREBASE;
    const ready = cfg && cfg.apiKey && cfg.apiKey !== "YOUR_API_KEY" && cfg.projectId;
    const gate = document.getElementById("gate");
    const appEl = document.getElementById("app");
    const listEl = document.getElementById("list");
    const gateErr = document.getElementById("gateErr");
    const googleBtn = document.getElementById("googleBtn");

    let tab = "open";
    let auth = null;
    let db = null;
    let booted = false;
    const provider = new GoogleAuthProvider();

    function isGoogle(u) {
      return !!(u && !u.isAnonymous && u.providerData &&
        u.providerData.some((p) => p.providerId === "google.com"));
    }
    /** Nombre visible: displayName → parte del email → Jugador */
    function niceName(u) {
      const dn = ((u && u.displayName) || "").trim();
      if (dn) return dn;
      const local = ((u && u.email) || "").split("@")[0];
      return local || "Jugador";
    }
    function greetName(u) {
      const dn = ((u && u.displayName) || "").trim();
      if (dn) return dn.split(/\s+/)[0];
      const local = ((u && u.email) || "").split("@")[0];
      return local || "jugador";
    }
    function initial(u) {
      return greetName(u).charAt(0).toUpperCase() || "F";
    }
    function mobile() {
      return /Android|iPhone|iPad|iPod|Mobile|Instagram|FBAN|FBAV|WhatsApp/i.test(
        navigator.userAgent || "",
      );
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function when(ms) {
      if (!ms) return "—";
      return new Date(ms).toLocaleString("es", {
        weekday: "short", day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function showGate(err) {
      gate.hidden = false;
      appEl.hidden = true;
      gateErr.hidden = !err;
      gateErr.textContent = err || "";
    }

    function showApp(u) {
      gate.hidden = true;
      appEl.hidden = false;
      document.getElementById("hello").textContent = "¡Hola, " + greetName(u) + "!";
      document.getElementById("emailLine").textContent = u.email || "";
      document.getElementById("avatar").textContent = initial(u);
    }

    async function finishRedirect() {
      try {
        await getRedirectResult(auth);
      } catch (e) {
        const code = e && e.code;
        if (code === "auth/credential-already-in-use" ||
            code === "auth/email-already-in-use" ||
            code === "auth/account-exists-with-different-credential") {
          const cred = GoogleAuthProvider.credentialFromError(e);
          if (cred) await signInWithCredential(auth, cred);
        } else {
          console.warn(e);
        }
      }
    }

    async function loginGoogle(pickAccount) {
      googleBtn.disabled = true;
      document.getElementById("gateHint").textContent = "Abriendo Google…";
      if (pickAccount) {
        provider.setCustomParameters({ prompt: "select_account" });
      } else {
        provider.setCustomParameters({});
      }
      try {
        if (mobile()) {
          await signInWithRedirect(auth, provider);
          return;
        }
        try {
          await signInWithPopup(auth, provider);
        } catch (e) {
          if (e && (e.code === "auth/popup-blocked" ||
              e.code === "auth/operation-not-supported-in-this-environment" ||
              e.code === "auth/cancelled-popup-request")) {
            await signInWithRedirect(auth, provider);
            return;
          }
          throw e;
        }
      } catch (e) {
        if (e && e.code === "auth/popup-closed-by-user") {
          showGate("Cerraste la ventana. Probá de nuevo cuando quieras.");
        } else {
          showGate(e.message || "No se pudo iniciar sesión.");
        }
      } finally {
        googleBtn.disabled = false;
        document.getElementById("gateHint").textContent =
          "Por ahora el acceso es solo con Google. Quedás logueado en este navegador.";
      }
    }

    function card(ev, badge) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "../e/?id=" + encodeURIComponent(ev.id);
      const type = ev.type === "torneo" ? "TORNEO" : "AMERICANA";
      const spots = (ev.joinedCount || 0) + " / " + (ev.capacity || 0) + " plazas";
      a.innerHTML =
        '<span class="chev">›</span>' +
        (badge ? '<span class="badge">' + badge + "</span>" : "") +
        '<span class="chip">' + type + "</span>" +
        "<h2>" + escapeHtml(ev.title || "Evento") + "</h2>" +
        '<p class="meta">' + when(ev.startsAtEpochMs) + "</p>" +
        (ev.zone || ev.venueText
          ? '<p class="meta">' + escapeHtml(ev.zone || ev.venueText) + "</p>"
          : "") +
        '<p class="meta">' + spots + "</p>";
      return a;
    }

    async function loadOpen() {
      const q = query(
        collection(db, "open_events"),
        where("status", "==", "open"),
        orderBy("startsAtEpochMs", "asc"),
      );
      const snap = await getDocs(q);
      const list = [];
      snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
      return list;
    }

    async function loadMine(uid) {
      const q = query(collectionGroup(db, "signups"), where("uid", "==", uid));
      const snap = await getDocs(q);
      const items = [];
      for (const d of snap.docs) {
        const er = d.ref.parent.parent;
        if (!er) continue;
        const ev = await getDoc(er);
        if (!ev.exists()) continue;
        items.push({
          id: ev.id,
          ...ev.data(),
          _st: d.data().status,
        });
      }
      items.sort((a, b) => (a.startsAtEpochMs || 0) - (b.startsAtEpochMs || 0));
      return items;
    }

    function indexLinkFromError(msg) {
      const m = String(msg || "").match(/https:\/\/console\.firebase\.google\.com[^\s)"]+/);
      return m ? m[0] : null;
    }

    async function refresh() {
      listEl.className = "loading";
      listEl.textContent = "Cargando…";
      try {
        listEl.className = "";
        listEl.innerHTML = "";
        if (tab === "open") {
          const list = await loadOpen();
          if (!list.length) {
            listEl.className = "empty";
            listEl.textContent = "No hay eventos abiertos por ahora.";
            return;
          }
          list.forEach((ev) => listEl.appendChild(card(ev)));
        } else {
          const items = await loadMine(auth.currentUser.uid);
          if (!items.length) {
            listEl.className = "empty";
            listEl.textContent = "Todavía no te anotaste a ningún evento. Mirá Abiertos.";
            return;
          }
          items.forEach((ev) => {
            const badge = ev._st === "waitlist" ? "Reserva" : "Inscrito";
            listEl.appendChild(card(ev, badge));
          });
        }
      } catch (e) {
        console.error(e);
        const link = indexLinkFromError(e && e.message);
        listEl.className = "err";
        if (link) {
          listEl.innerHTML =
            "Falta un índice de Firestore para “Mis inscripciones”.<br><br>" +
            '<a href="' + link + '" target="_blank" rel="noopener">Crear índice en Firebase</a>' +
            "<br><br>Cuando diga Enabled, recargá esta página.";
        } else {
          listEl.textContent = (e && e.message) || "Error al cargar.";
        }
      }
    }

    function setTab(next) {
      tab = next;
      document.getElementById("tabOpen").classList.toggle("active", next === "open");
      document.getElementById("tabMine").classList.toggle("active", next === "mine");
      refresh();
    }

    googleBtn.addEventListener("click", () => loginGoogle(false));
    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await signOut(auth);
      showGate("");
    });
    document.getElementById("switchBtn").addEventListener("click", async () => {
      await signOut(auth);
      showGate("");
      await loginGoogle(true);
    });
    document.getElementById("tabOpen").addEventListener("click", () => setTab("open"));
    document.getElementById("tabMine").addEventListener("click", () => setTab("mine"));

    if (!ready) {
      showGate("Falta configurar Firebase en el sitio.");
    } else {
      const app = initializeApp(cfg);
      auth = getAuth(app);
      db = getFirestore(app);
      try { await setPersistence(auth, browserLocalPersistence); } catch (_) {}
      await finishRedirect();

      onAuthStateChanged(auth, async (u) => {
        if (isGoogle(u)) {
          showApp(u);
          if (!booted) {
            booted = true;
            await refresh();
          } else if (!appEl.hidden) {
            await refresh();
          }
        } else {
          booted = false;
          showGate("");
        }
      });
    }
  </script>
</body>
</html>
